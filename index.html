  <section class="intro">
    <h1 class="headline"><span class="headline__accent">Creative</span><br> at scale.</h1>

  <p class="hint">Drag to explore · Click a case</p>

  <div class="cursor" id="cursor" aria-hidden="true">
    <span class="cursor__ring"></span>
    <span class="cursor__dot"></span>
  </div>

  <div class="focus" id="focus" aria-hidden="true">
    <i></i><i></i><i></i><i></i>
    <span class="focus__label" id="focusLabel"></span>
  </div>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
    <div class="viewer__media" id="viewerMedia"></div>
    <aside class="viewer__info" id="vInfo">
      <span class="viewer__idx" id="vIdx"></span>
      <h2 class="viewer__title" id="vTitle"></h2>
      <dl class="viewer__facts">
        <div><dt>Client</dt><dd id="vClient"></dd></div>
        <div><dt>Services</dt><dd id="vServices"></dd></div>
        <div><dt>Year</dt><dd id="vYear"></dd></div>
      </dl>
      <p class="viewer__desc" id="vDesc"></p>
      <ul class="viewer__results" id="vResults"></ul>
      <div class="viewer__frames" id="vFrames" aria-label="Frames"></div>
      <nav class="viewer__nav">
        <button class="pill pill--light" id="vPrev" type="button">← Prev case</button>
        <button class="pill pill--dark" id="vNext" type="button">Next case →</button>
      </nav>
    </aside>
    <div class="viewer__modes" id="vModes" role="group" aria-label="Case layout">
      <button type="button" data-mode="panel">Panel</button>
      <button type="button" data-mode="cinema">Cinema</button>
      <button type="button" data-mode="poster">Poster</button>
      <button type="button" data-mode="split">Split</button>
      <button type="button" data-mode="strip">Strip</button>
    </div>
    <button class="pill pill--dark viewer__close" id="vClose" type="button" aria-label="Close"></button>
  </div>
